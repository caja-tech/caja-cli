name: Publish NPM Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NPM to verify GitHub's identity
      contents: read  # Required to checkout the code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5' # Or whichever version your project uses

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Extract version and determine NPM tag
        id: extract_version
        run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            
            # If the version contains a hyphen, it's a pre-release (e.g., 0.1.0-alpha.1)
            if [[ "$VERSION" == *"-"* ]]; then
              echo "NPM_TAG=next" >> $GITHUB_ENV
              echo "Building PRE-RELEASE version $VERSION with tag @next"
            else
              echo "NPM_TAG=latest" >> $GITHUB_ENV
              echo "Building STABLE version $VERSION with tag @latest"
            fi

      - name: Build and Publish Architecture Packages
        run: |
            declare -A os_map=( ["darwin"]="darwin" ["linux"]="linux" ["win32"]="windows" )
            declare -A arch_map=( ["x64"]="amd64" ["arm64"]="arm64" )
            
            for os in darwin linux win32; do
              for arch in x64 arm64; do
                GOOS=${os_map[$os]}
                GOARCH=${arch_map[$arch]}
            
                BIN_NAME="caja"
                if [ "$os" == "win32" ]; then
                  BIN_NAME="caja.exe"
                fi
            
                PKG_DIR="dist/@caja/cli-${os}-${arch}"
                mkdir -p "$PKG_DIR/bin"
            
                echo "Building for $os $arch (GOOS=$GOOS GOARCH=$GOARCH)..."
            
                CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-X main.Version=${VERSION}" -o "$PKG_DIR/bin/$BIN_NAME" ./cmd/cli
            
                cat <<EOF > "$PKG_DIR/package.json"
            {
              "name": "@caja/cli-${os}-${arch}",
              "version": "${VERSION}",
              "description": "Caja CLI Tool (${os} ${arch})",
              "repository": {
                "type": "git",
                "url": "git+https://github.com/${{ github.repository }}.git"
              },
              "os": ["${os}"],
              "cpu": ["${arch}"]
            }
            EOF
            
                echo "Publishing @caja/cli-${os}-${arch} with tag ${NPM_TAG}..."
                cp README.md "$PKG_DIR/"
                cd "$PKG_DIR"
                npm publish --access public --tag ${NPM_TAG}
                cd - > /dev/null
              done
            done

      - name: Publish Main Wrapper Package
        run: |
            cp README.md npm/
            cd npm
            
            jq ".version = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-darwin-arm64\"] = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-darwin-x64\"] = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-linux-arm64\"] = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-linux-x64\"] = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-win32-arm64\"] = \"${VERSION}\" | \
                .optionalDependencies[\"@caja/cli-win32-x64\"] = \"${VERSION}\"" package.json > package.tmp.json
            
            mv package.tmp.json package.json
            
            echo "Publishing @caja/cli wrapper with tag ${NPM_TAG}..."
            npm publish --access public --tag ${NPM_TAG}
